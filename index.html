<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocialScoreWebApp</title>

    <!-- Dynamic base path - works for local, GitHub Pages, and Cloudflare Pages -->
    <!-- IMPORTANT: Script MUST run BEFORE base tag to prevent initial 404 errors -->
    <script>
        // Detect environment and set correct base path IMMEDIATELY
        (function() {
            var hostname = window.location.hostname;
            var basePath = '/';

            // GitHub Pages detection
            if (hostname === 'kapambwe.github.io' || hostname.includes('github.io')) {
                basePath = '/SocialScoreWebApp/';
                console.log('🌐 GitHub Pages detected - using base: /SocialScoreWebApp/');
            }
            // Cloudflare Pages detection (.pages.dev domain)
            else if (hostname.includes('pages.dev')) {
                basePath = '/';
                console.log('☁️ Cloudflare Pages detected - using base: /');
            }
            // Custom domain or local development
            else {
                basePath = '/';
                console.log('💻 Local/Custom domain detected - using base: /');
            }

            // Write the base tag with correct href IMMEDIATELY
            document.write('<base href="' + basePath + '" />');
        })();
    </script>

    <!-- Single Page App for GitHub Pages -->
    <!-- Start Single Page App script -->
    <script type="text/javascript">
        // Single Page App for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        (function(l) {
            if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
    <!-- End Single Page App script -->

    <!-- Defer non-critical CSS to avoid blocking render -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="css/app.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/app.css">
        <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css">
    </noscript>

    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SocialScoreWebApp.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text">Loading...</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Blazor WebAssembly bootstrap - .NET publish replaces with fingerprinted filename -->
    <!-- The <base href> set above ensures correct path resolution on GitHub Pages -->
    <script src="_framework/blazor.webassembly.js" defer></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        }
    </script>
</body>

</html>
